<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Still Out There</title>
  <meta name="description" content="Fly from Earth to the Moon, Mars and deep space and visit the ten machines people left behind, with live data and NASA 3D models. They stopped talking. They never left.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f2efe8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ff6a33'/%3E%3C/svg%3E">
  <link rel="preload" href="vendor/fonts/geist-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/geist-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/universe.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
  <a class="skip" href="#card" data-i18n="app.skip">Skip to content</a>
  <div id="boot" class="boot" aria-live="polite"><span class="boot-mark" aria-hidden="true"></span><p class="boot-text">Calling the machines…</p><span class="boot-line" aria-hidden="true"><i></i></span></div>
  <div id="space" class="space"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="#/start"><span class="brand-mark" aria-hidden="true"></span><span data-i18n="app.title">Still Out There</span></a>
    <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
    <div class="tools">
      <p class="signal" id="signal" hidden></p>
      <button type="button" class="tool icon-tool" id="sound-btn" aria-label="Music" aria-pressed="true"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></button>
      <button type="button" class="tool" id="map-btn" aria-expanded="false" aria-controls="map"><span class="map-icon" aria-hidden="true"></span><span data-i18n="map.button">Map</span></button>
      <span class="langs" role="group" aria-label="Language"></span>
    </div>
  </header>

  <main id="card" class="card-host" tabindex="-1">
    <p class="loading">Calling the machines…</p>
    <noscript><p class="loading">This site needs JavaScript to work out what time it is on Mars.</p></noscript>
  </main>

  <div id="flight" class="flight" aria-live="polite" hidden></div>

  <nav class="pager" aria-label="Journey">
    <p class="where" id="where"></p>
    <div class="pager-btns">
      <button type="button" class="round" id="back" hidden><span aria-hidden="true">←</span></button>
      <button type="button" class="next" id="next" hidden><span class="next-text"><span class="next-hint" data-i18n="pager.next">Next</span><span id="next-name"></span></span><span class="next-arrow" aria-hidden="true">→</span></button>
    </div>
  </nav>

  <div id="map" class="map" role="dialog" aria-modal="true" aria-labelledby="map-title" hidden></div>
  <div id="layer" hidden></div>

  <script src="vendor/astronomy.browser.min.js"></script>
  <script src="vendor/gsap/gsap.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
